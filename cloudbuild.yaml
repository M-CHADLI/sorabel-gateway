# Chaîne CI/CD Cloud Build : déclenchée sur push vers main.
#
# tests -> build (image unique, deux entrypoints) -> push Artifact Registry ->
# déploiement des deux services Cloud Run (sorabel-mcp, sorabel-front).
#
# Les tests sont une barrière : Cloud Build exécute les étapes dans l'ordre et
# s'arrête à la première en échec, donc un test rouge empêche tout déploiement.
#
# --async sur les deux déploiements : sans lui, `gcloud run deploy` attend que la nouvelle
# révision devienne saine avant de rendre la main. Or au tout premier passage (amorçage,
# voir les substitutions _SORABEL_URL_PUBLIQUE / _SORABEL_IAP_AUDIENCE / _SORABEL_URL_MCP
# ci-dessous), sorabel-mcp ne peut pas encore démarrer sain — sans --async, `deploy-mcp`
# échouerait et empêcherait `deploy-front` de s'exécuter, cassant le bootstrap.
steps:
  # `data/canonique/` est régénérable et gitignorée (voir .gitignore) : un checkout frais
  # ne l'a jamais eue. L'ingestion est une extraction déterministe sans appel réseau (aucune
  # référence Azure dans sorabel_rag/ingestion.py) — sûre à exécuter ici, contrairement à
  # l'indexation (Chroma/BM25), qui appelle les embeddings et reste réservée à l'étape `build`.
  - id: tests
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -c
      - |
        pip install --no-cache-dir uv
        uv sync --frozen
        uv run python scripts/ingerer.py
        uv run pytest -q

  # Construit l'image à deux étapes du Dockerfile (tâche 9) : l'étape `index` y
  # exécute l'ingestion puis l'indexation, qui appellent Azure AI Foundry pour
  # les embeddings.
  #
  # Écart avec la version initiale de ce fichier : le Dockerfile déclare trois
  # ARG non secrets que l'étape `index` exige pour aboutir — AZURE_EMBEDDING_ENDPOINT,
  # AZURE_OPENAI_ENDPOINT et AZURE_OPENAI_EMBEDDING_DEPLOYMENT (endpoint et nom de
  # déploiement : des identifiants de ressource, pas des clés). Ils sont passés en
  # --build-arg ci-dessous, alimentés par les substitutions du même nom (voir bloc
  # `substitutions`, valeur vide par défaut). Seule la clé d'API reste un secret,
  # montée via le mécanisme --secret de BuildKit.
  - id: build
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    secretEnv: [AZURE_EMBEDDING_API_KEY]
    args:
      - -c
      - |
        set -e
        echo "$$AZURE_EMBEDDING_API_KEY" > /workspace/cle
        DOCKER_BUILDKIT=1 docker build \
          --secret id=azure_embedding_key,src=/workspace/cle \
          --build-arg AZURE_EMBEDDING_ENDPOINT="$_AZURE_EMBEDDING_ENDPOINT" \
          --build-arg AZURE_OPENAI_ENDPOINT="$_AZURE_OPENAI_ENDPOINT" \
          --build-arg AZURE_OPENAI_EMBEDDING_DEPLOYMENT="$_AZURE_OPENAI_EMBEDDING_DEPLOYMENT" \
          -t "$_IMAGE:$SHORT_SHA" -t "$_IMAGE:latest" .
        rm /workspace/cle

  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, "$_IMAGE"]

  - id: deploy-mcp
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - sorabel-mcp
      - --image=$_IMAGE:$SHORT_SHA
      - --region=$_REGION
      - --service-account=sorabel-mcp@$PROJECT_ID.iam.gserviceaccount.com
      - --command=python
      - --args=-m,mcp_server.serveur
      - --set-env-vars=SORABEL_TRANSPORT=http,SORABEL_JOURNAL=stdout,SORABEL_DEPOT=firestore,SORABEL_OIDC_ISSUER=$_SORABEL_OIDC_ISSUER,SORABEL_OIDC_AUDIENCE=$_SORABEL_OIDC_AUDIENCE,SORABEL_URL_PUBLIQUE=$_SORABEL_URL_PUBLIQUE,SORABEL_IAP_AUDIENCE=$_SORABEL_IAP_AUDIENCE,SORABEL_OIDC_JWKS=$_SORABEL_OIDC_JWKS,AZURE_OPENAI_ENDPOINT=$_AZURE_OPENAI_ENDPOINT,AZURE_OPENAI_DEPLOYMENT=$_AZURE_OPENAI_DEPLOYMENT
      - --set-secrets=AZURE_OPENAI_API_KEY=azure-openai-key:latest
      - --min-instances=0
      - --max-instances=4
      - --async

  - id: deploy-front
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - sorabel-front
      - --image=$_IMAGE:$SHORT_SHA
      - --region=$_REGION
      - --service-account=sorabel-front@$PROJECT_ID.iam.gserviceaccount.com
      - --command=streamlit
      - --args=run,front/app_client.py,--server.port=8080,--server.address=0.0.0.0
      - --set-env-vars=SORABEL_DEPOT=firestore,SORABEL_JOURNAL=stdout,SORABEL_URL_MCP=$_SORABEL_URL_MCP
      - --session-affinity
      - --min-instances=0
      - --max-instances=2
      - --async

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/azure-embedding-key/versions/latest
      env: AZURE_EMBEDDING_API_KEY

# _REGION et _IMAGE : région et dépôt Artifact Registry, conformes à la conception
# (§2 et §7 de docs/superpowers/specs/2026-09-07-sorabel-gcp-vitrine-design.md).
#
# _AZURE_EMBEDDING_ENDPOINT, _AZURE_OPENAI_ENDPOINT, _AZURE_OPENAI_EMBEDDING_DEPLOYMENT :
# comblent l'écart entre ce fichier et le Dockerfile réel (tâche 9) — ce ne sont pas
# des secrets (identifiants de ressource Azure : URL d'endpoint, nom de déploiement),
# donc pas de mécanisme --secret BuildKit ni d'entrée Secret Manager, seulement des
# substitutions, laissées vides ici. À LA TÂCHE 11 (provisionnement GCP) : renseigner
# ces trois substitutions avec les vraies valeurs Azure AI Foundry dans la
# configuration du déclencheur Cloud Build — sans quoi l'étape `build` échoue dès
# l'ingestion (cf. Dockerfile ARG, et sorabel_rag/index.py qui exige un endpoint et
# un déploiement d'embeddings résolus, sans valeur par défaut).
#
# _SORABEL_OIDC_ISSUER, _SORABEL_OIDC_AUDIENCE, _SORABEL_URL_PUBLIQUE,
# _SORABEL_IAP_AUDIENCE, _SORABEL_OIDC_JWKS, _AZURE_OPENAI_DEPLOYMENT (et
# _AZURE_OPENAI_ENDPOINT ci-dessus, réutilisé) : mcp_server/serveur.py accède par
# crochet (pas .get()) aux variables OIDC/IAP en transport HTTP, et
# sorabel_llm/client.py exige l'endpoint et le déploiement Azure à la résolution
# paresseuse — sans valeur, échec immédiat (KeyError) ou échec de toute requête
# RAG/SQL. Ce ne sont pas des secrets (identifiants de fournisseur d'identité et de
# ressource Azure, pas des clés), donc de simples substitutions, laissées vides ici :
# ni Google Identity Platform/IAP ni la ressource Azure de génération ne sont encore
# provisionnés. À LA TÂCHE 11 (provisionnement GCP réel) : renseigner ces sept
# substitutions dans la configuration du déclencheur Cloud Build.
#
# _SORABEL_URL_MCP : front/passerelle.py s'en sert pour joindre le service
# sorabel-mcp (repli sur http://localhost:8080/mcp sinon, ce qui dans le conteneur
# `sorabel-front` désigne Streamlit lui-même — pas le serveur MCP). Contrairement
# aux variables ci-dessus, ce n'est pas un défaut de provisionnement : sa valeur ne
# peut être connue qu'après le premier déploiement de `sorabel-mcp`, puisque c'est
# l'URL Cloud Run attribuée à ce service (stable ensuite d'un déploiement à
# l'autre). À LA TÂCHE 11 : déployer `sorabel-mcp` une première fois, récupérer son
# URL (gcloud run services describe sorabel-mcp --region=... --format='value(status.url)'),
# puis renseigner cette substitution dans la configuration du déclencheur — sans
# quoi `deploy-front` démarre sans erreur mais chaque appel de tool échoue
# silencieusement dès la première interaction utilisateur.
substitutions:
  _REGION: europe-west1
  _IMAGE: europe-west1-docker.pkg.dev/${PROJECT_ID}/sorabel/gateway
  _AZURE_EMBEDDING_ENDPOINT: ""
  _AZURE_OPENAI_ENDPOINT: ""
  _AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ""
  _SORABEL_OIDC_ISSUER: ""
  _SORABEL_OIDC_AUDIENCE: ""
  _SORABEL_URL_PUBLIQUE: ""
  _SORABEL_IAP_AUDIENCE: ""
  _SORABEL_OIDC_JWKS: ""
  _AZURE_OPENAI_DEPLOYMENT: ""
  _SORABEL_URL_MCP: ""

options:
  logging: CLOUD_LOGGING_ONLY
